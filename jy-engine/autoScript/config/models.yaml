vision:
  provider: "agnes"
  api_key: "${AGNES_API_KEY}"
  model: "agnes-3.0-flash"
  base_url: "https://apihub.agnes-ai.com/v1"
  timeout: 120
  max_retries: 2

# 备用：火山方舟 doubao（多模态，vision_available 实测通过，需 DOUBAO_API_KEY）
