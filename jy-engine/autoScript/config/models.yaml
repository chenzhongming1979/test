ocr:
  provider: "rapidocr"

feature_sampler:
  point_count: 3
  variance_threshold: 50
  contrast_threshold: 30
  min_tolerance: "101010"
  max_tolerance: "303030"
  verify_frames: 3

compiler:
  default_platform: "lua"
  timeout_multiplier: 1.5
  no_feature_count: 5
  big_count_default: 20
  loop_detection_threshold: 3

verifier:
  phash_diff_threshold: 5
  max_retry: 2
  wait_stable_timeout_ms: 3000
